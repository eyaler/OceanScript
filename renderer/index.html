<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OceanScript renderer</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; height: 100%; overflow: hidden; font-family: "Segoe UI", "Noto Sans", "Noto Sans Hebrew", "DejaVu Sans", Arial, sans-serif; }
  #stage { --s: 1; position: absolute; left: 0; top: 0; width: 1280px; height: 720px; overflow: hidden; background: #000; transform-origin: 0 0; }
  canvas { display: block; }
  #ui { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; }
  #subs { position: absolute; left: 6%; right: 6%; bottom: 6%; box-sizing: border-box; text-align: center; color: #fff; font-size: calc(34px * var(--s)); line-height: 1.3; text-shadow: 0 2px 6px rgba(0,0,0,.85), 0 0 2px rgba(0,0,0,.9); font-weight: 600; }
  #subs .speaker { font-weight: 800; margin-inline-end: .35em; }
  #subs .narration { font-style: italic; font-weight: 500; color: #eaf6ff; }
  #subs .caption { font-weight: 500; }
  #subs .line { display: inline-block; padding: .1em .6em; border-radius: .35em; background: rgba(0, 8, 24, .55); box-shadow: 0 0 12px rgba(0,8,24,.35); }
  #title { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; text-align: center; opacity: 0; }
  #title .main { font-size: calc(84px * var(--s)); font-weight: 800; letter-spacing: .02em; text-shadow: 0 4px 24px rgba(0,0,0,.7), 0 0 60px rgba(120,200,255,.55); }
  #title .sub { font-size: calc(34px * var(--s)); font-weight: 500; margin-top: .5em; opacity: .92; text-shadow: 0 2px 10px rgba(0,0,0,.7); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
  /* circle iris: a black frame with a transparent hole (clip-path on an inverted mask is not
     available everywhere, so the hole is painted with a huge box-shadow) */
  #iris { position: absolute; inset: 0; opacity: 0; pointer-events: none; overflow: hidden; --d: 0px; }
  #iris::before { content: ""; position: absolute; left: 50%; top: 50%; width: var(--d); height: var(--d); transform: translate(-50%, -50%); border-radius: 50%; box-shadow: 0 0 0 4000px #000; }
  #imagecard { position: absolute; inset: 0; background: #000; opacity: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #imagecard img { width: 100%; height: 100%; object-fit: contain; }
  #imagecard .cap { position: absolute; bottom: 6%; left: 6%; right: 6%; text-align: center; color: #fff; font-size: calc(30px * var(--s)); text-shadow: 0 2px 8px rgba(0,0,0,.8); }
  #clip { position: absolute; inset: 0; background: #000; opacity: 0; }
  #clip video { width: 100%; height: 100%; object-fit: contain; }
  #credits { position: absolute; inset: 0; background: rgba(0,0,0,.85); opacity: 0; overflow: hidden; }
  #credits .roll { position: absolute; left: 0; right: 0; top: 0; text-align: center; color: #fff; font-size: calc(36px * var(--s)); line-height: 1.7; font-weight: 600; }
  #stage { font-family: var(--script-font, "Segoe UI"), "Segoe UI", "Noto Sans", "Noto Sans Hebrew", "DejaVu Sans", Arial, sans-serif; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(10,14,22,.92); color: #cfe; font: 13px monospace; padding: 8px 12px; display: flex; gap: 12px; align-items: center; z-index: 10; }
  #controls input[type=range] { flex: 1; }
  #controls button { background: #244; color: #cfe; border: 1px solid #466; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  #controls .markers { position: absolute; left: 0; right: 0; top: -14px; height: 12px; pointer-events: none; }
  #controls .markers span { position: absolute; top: 0; font-size: 10px; color: #8ff; white-space: nowrap; transform: translateX(-50%); }
  #warnings { position: fixed; right: 8px; top: 8px; max-width: 40%; background: rgba(60,20,20,.85); color: #fdd; font: 12px monospace; padding: 6px 10px; border-radius: 6px; white-space: pre-wrap; z-index: 10; }
  body.headless #controls, body.headless #warnings { display: none; }
</style>
<script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js" } }</script>
</head>
<body>
  <div id="stage">
    <div id="ui">
      <div id="clip"><video playsinline></video></div>
      <div id="imagecard"><img alt="" /><div class="cap"></div></div>
      <div id="credits"><div class="roll"></div></div>
      <div id="title"><div class="main"></div><div class="sub"></div></div>
      <div id="subs"></div>
      <div id="iris"></div>
      <div id="fade"></div>
    </div>
  </div>
  <div id="controls">
    <button id="play">▶</button>
    <span id="time">0.00</span>
    <div style="position:relative;flex:1;display:flex"><div class="markers" id="markers"></div><input id="scrub" type="range" min="0" max="1000" value="0" step="1" /></div>
    <span id="dur"></span>
    <span id="fpsmeter"></span>
  </div>
  <div id="warnings" hidden></div>
  <script type="module" src="/renderer/main.js"></script>
</body>
</html>
