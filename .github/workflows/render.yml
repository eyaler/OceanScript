# Renders an OceanScript screenplay on GitHub-hosted runners and publishes the
# video as a GitHub Release asset (up to 2 GB per file), so long or
# high-resolution films are not limited by the 100 MB per-file limit of git.
#
# Frames are deterministic, so the frame range is split across a matrix of
# parallel jobs; a final job concatenates the chunks, adds voices and
# subtitles, and uploads the result.
name: Render

on:
  workflow_dispatch:
    inputs:
      script:
        description: Script file (relative to the repo)
        default: examples/caspion.md
      lang:
        description: Language code (subtitles, title cards, voices)
        default: en
      width:
        description: Output width
        default: "1920"
      height:
        description: Output height
        default: "1080"
      chunks:
        description: Number of parallel render jobs
        default: "6"
      crf:
        description: x264 quality (lower = better, 18 = near lossless)
        default: "17"
      release:
        description: Release tag to upload to
        default: renders

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      frames: ${{ steps.plan.outputs.frames }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts
      - name: Resolve audio timing and count frames
        id: plan
        run: |
          mkdir -p out
          PINNED="${{ inputs.script }}"; PINNED="${PINNED%.md}.timing.json"
          [ -f "$PINNED" ] && cp "$PINNED" out/render.timing.json && echo "using pinned timing $PINNED"
          node bin/oceanscript.js check "${{ inputs.script }}" --lang "${{ inputs.lang }}" --width ${{ inputs.width }} --height ${{ inputs.height }} --timing-file out/render.timing.json > check.txt
          cat check.txt
          FRAMES=$(grep -oE '[0-9]+ frames' check.txt | grep -oE '[0-9]+')
          echo "frames=$FRAMES" >> "$GITHUB_OUTPUT"
          python3 - "$FRAMES" "${{ inputs.chunks }}" <<'PY' >> "$GITHUB_OUTPUT"
          import sys, json, math
          frames, n = int(sys.argv[1]), int(sys.argv[2])
          per = math.ceil(frames / n)
          chunks = [{"i": i, "a": i * per, "b": min(frames, (i + 1) * per)} for i in range(n) if i * per < frames]
          print("matrix=" + json.dumps({"chunk": chunks}))
          PY
      - name: Save timing
        uses: actions/upload-artifact@v4
        with:
          name: timing
          path: out/*.timing.json
          if-no-files-found: ignore

  render:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts
      - uses: actions/download-artifact@v4
        with: { name: timing, path: out }
        continue-on-error: true
      - name: Render frames ${{ matrix.chunk.a }}-${{ matrix.chunk.b }}
        run: |
          SETUP=$(( $(date +%s) - JOB_START ))
          TF=$(ls out/*.timing.json 2>/dev/null | head -1)
          CHUNK=out/chunks/chunk_$(printf %02d ${{ matrix.chunk.i }})
          T0=$(date +%s)
          node bin/oceanscript.js render "${{ inputs.script }}" --lang "${{ inputs.lang }}" \
            --width ${{ inputs.width }} --height ${{ inputs.height }} --crf ${{ inputs.crf }} \
            --start-frame ${{ matrix.chunk.a }} --end-frame ${{ matrix.chunk.b }} --raw \
            ${TF:+--timing-file $TF} -o $CHUNK.mp4
          # record the runner setup time (checkout, npm ci, playwright, apt) next to the render profile
          python3 - "$CHUNK.profile.json" "$SETUP" "$(( $(date +%s) - T0 ))" "${{ matrix.chunk.i }}" <<'PY'
          import json, sys
          f, setup, wall, i = sys.argv[1], int(sys.argv[2]), int(sys.argv[3]), int(sys.argv[4])
          p = json.load(open(f)); p['setup'] = setup; p['wall'] = wall; p['chunk'] = i
          json.dump(p, open(f, 'w'), indent=1)
          rows = sorted(p['phases'].items(), key=lambda kv: -kv[1])
          out = [f"### chunk {i}: setup {setup}s, render {wall}s, {p['frames']} frames ({p['frames']/max(wall,1):.2f} fps)", '', '| phase | s | % |', '|---|---:|---:|']
          out += [f"| {k} | {v:.0f} | {100*v/max(p['total'],1e-6):.0f} |" for k, v in rows]
          fr = max(p['frames'], 1)
          out += ['', f"per frame: evaluate {p['page']['evalMs']/fr:.0f} ms, draw {p['page']['drawMs']/fr:.0f} ms, screenshot {p['phases'].get('frames.screenshot',0)*1000/fr:.0f} ms, encoder wait {p['phases'].get('frames.encode-wait',0)*1000/fr:.0f} ms"]
          open('summary.md', 'w').write('\n'.join(out) + '\n')
          PY
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
      - uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ matrix.chunk.i }}
          path: |
            out/chunks/*.mp4
            out/chunks/*.profile.json

  publish:
    needs: [plan, render]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install edge-tts
      - uses: actions/download-artifact@v4
        with: { pattern: chunk-*, path: out/chunks, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: timing, path: out }
        continue-on-error: true
      - name: Concatenate, add voices and subtitles
        run: |
          SETUP=$(( $(date +%s) - JOB_START ))
          NAME=$(basename "${{ inputs.script }}" .md)
          ls out/chunks
          for f in $(ls out/chunks/*.mp4 | sort); do echo "file '$PWD/$f'"; done > out/list.txt
          T0=$(date +%s)
          ffmpeg -y -f concat -safe 0 -i out/list.txt -c copy out/$NAME.${{ inputs.lang }}.video.mp4
          T1=$(date +%s)
          TF=$(ls out/*.timing.json 2>/dev/null | head -1)
          node bin/oceanscript.js mux "${{ inputs.script }}" --video out/$NAME.${{ inputs.lang }}.video.mp4 --lang "${{ inputs.lang }}" ${TF:+--timing-file $TF} -o out/$NAME.${{ inputs.lang }}.${{ inputs.height }}p.mp4
          T2=$(date +%s)
          ls -la out
          echo "PUBLISH_SETUP=$SETUP" >> "$GITHUB_ENV"; echo "CONCAT_S=$((T1-T0))" >> "$GITHUB_ENV"; echo "MUX_S=$((T2-T1))" >> "$GITHUB_ENV"
      - name: Timing report
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, glob, os
          ps = [json.load(open(f)) for f in sorted(glob.glob('out/chunks/*.profile.json'))]
          print('## Where the time went')
          print()
          if ps:
              walls = [p.get('wall', p['total']) for p in ps]; setups = [p.get('setup', 0) for p in ps]
              frames = sum(p['frames'] for p in ps)
              print(f"{len(ps)} render chunks, {frames} frames.  Per chunk: runner setup {min(setups)}-{max(setups)}s, render {min(walls)}-{max(walls)}s (the slowest chunk gates the run).")
              print()
              tot = {}
              for p in ps:
                  for k, v in p['phases'].items(): tot[k] = tot.get(k, 0) + v
              cpu = sum(tot.values())
              print('| phase (summed over chunks) | cpu-s | % |'); print('|---|---:|---:|')
              for k, v in sorted(tot.items(), key=lambda kv: -kv[1]): print(f"| {k} | {v:.0f} | {100*v/max(cpu,1e-6):.0f} |")
              ev = sum(p['page']['evalMs'] for p in ps) / max(frames, 1); dr = sum(p['page']['drawMs'] for p in ps) / max(frames, 1)
              ss = tot.get('frames.screenshot', 0) * 1000 / max(frames, 1); ew = tot.get('frames.encode-wait', 0) * 1000 / max(frames, 1)
              print(); print(f"Per frame: timeline evaluation {ev:.0f} ms, draw (SwiftShader) {dr:.0f} ms, PNG readback {ss:.0f} ms, waiting for x264 {ew:.0f} ms.")
              print()
          print(f"Publish job: runner setup {os.environ.get('PUBLISH_SETUP','?')}s, concat {os.environ.get('CONCAT_S','?')}s, voices + subtitles mux {os.environ.get('MUX_S','?')}s.")
          PY
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NAME=$(basename "${{ inputs.script }}" .md)
          gh release view "${{ inputs.release }}" >/dev/null 2>&1 || gh release create "${{ inputs.release }}" --title "OceanScript renders" --notes "Videos rendered by the Render workflow." --prerelease
          gh release upload "${{ inputs.release }}" out/$NAME.${{ inputs.lang }}.${{ inputs.height }}p.mp4 out/$NAME.${{ inputs.lang }}.${{ inputs.height }}p.srt out/$NAME.${{ inputs.lang }}.${{ inputs.height }}p.vtt --clobber
